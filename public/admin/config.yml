# Decap CMS configuration for Heykelsan.
#
# Production backend: edits are committed directly to GitHub via OAuth login.
# `local_backend: true` additionally lets `/admin` fall back to the local
# proxy server when the panel is opened on localhost — run `npx decap-server`
# alongside `npm run dev` for that.
backend:
  name: github
  repo: cemyapayzeka99/heykelsan
  branch: main
  base_url: https://decap-bridge.vercel.app
  auth_endpoint: /api/auth

local_backend: true

media_folder: "public/images/products"
public_folder: "/images/products"

collections:
  - name: "products"
    label: "Ürünler"
    label_singular: "Ürün"
    description: "Heykelsan katalog verisi (data/products.json)"
    files:
      - name: "products"
        label: "Ürün Kataloğu"
        file: "data/products.json"
        fields:
          - label: "Ürünler"
            name: "products"
            widget: "list"
            label_singular: "Ürün"
            summary: "{{fields.title}} — {{fields.id}}"
            fields:
              - label: "Ürün Kodu (ID)"
                name: "id"
                widget: "string"
                hint: "Örn: SAK016, ATA011"

              - label: "Başlık"
                name: "title"
                widget: "string"

              - label: "Slug"
                name: "slug"
                widget: "string"
                hint: "URL'de kullanılır, örn: konik-saksi-sak019"

              - label: "Kategori"
                name: "category"
                widget: "select"
                options:
                  - { label: "Heykeller", value: "heykeller" }
                  - { label: "Hayvan Heykelleri", value: "hayvan-heykelleri" }
                  - { label: "Sütunlar", value: "sutunlar" }
                  - { label: "Atatürk Heykelleri", value: "ataturk-heykelleri" }
                  - { label: "Rölyefler ve Tuğralar", value: "rolyefler-ve-tugralar" }
                  - { label: "Duvar Kaplama Plakaları", value: "duvar-kaplama-plakalari" }
                  - { label: "Saksılar", value: "saksilar" }
                  - { label: "Bahçe Aksesuarları", value: "bahce-aksesuarlari" }
                  - { label: "Osmanlı Heykelleri ve Büstleri", value: "osmanli-heykelleri-bustleri" }

              - label: "Açıklama"
                name: "description"
                widget: "text"
                required: false

              - label: "Ölçüler"
                name: "dimensions"
                widget: "string"
                required: false
                hint: "Örn: Yükseklik: 70 cm, Genişlik: 40 cm"

              - label: "Fiyat"
                name: "price"
                widget: "number"
                value_type: "float"
                required: false
                hint: "Boş bırakılırsa fiyat sitede gösterilmez"

              - label: "Görseller"
                name: "image_urls"
                widget: "list"
                required: false
                summary: "{{fields.image}}"
                field:
                  label: "Görsel"
                  name: "image"
                  widget: "image"
                  media_library:
                    config:
                      multiple: false

              - label: "Kaynak URL"
                name: "url"
                widget: "hidden"
                required: false
